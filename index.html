<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#1d2923;--muted:#64736a;--line:#dce6df;--accent:#26734d;--soft:#e6f3eb;--good:#e1f4e7;--bad:#fde9e7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#173e2b;color:white;padding:24px 18px}header .wrap,main{max-width:1050px;margin:auto}h1{font-size:clamp(25px,5vw,36px);margin:0 0 5px}header p{margin:0;color:#d8e9df}
main{padding:18px 14px 45px}.layout{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 2px 10px #173e2b08}
h2{font-size:23px;line-height:1.25;margin:4px 0 14px}h3{font-size:18px;margin:18px 0 8px}.muted{color:var(--muted);font-size:14px}
#nav{display:grid;gap:7px;max-height:75vh;overflow:auto}.navbtn{border:1px solid var(--line);background:white;border-radius:11px;padding:10px;text-align:left;color:var(--ink);cursor:pointer;font:inherit;font-size:14px}.navbtn.active{border-color:var(--accent);background:var(--soft);font-weight:700}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tab,button.action{border:1px solid var(--line);border-radius:10px;background:white;padding:9px 13px;font:inherit;cursor:pointer}.tab.active,button.action.primary{background:var(--soft);border-color:var(--accent);color:#174c30;font-weight:700}
.term{padding:10px 0;border-bottom:1px solid var(--line)}.term b{display:block}.term span{color:var(--muted);font-size:14px}
.question{border:1px solid var(--line);border-radius:13px;padding:14px;margin:12px 0}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:9px;padding:10px;margin-top:7px;font:inherit;cursor:pointer}.option.selected{border-color:var(--accent);background:var(--soft)}.option.correct{border-color:#26834b;background:var(--good)}.option.wrong{border-color:#c64b40;background:var(--bad)}.feedback{font-size:14px;margin-top:9px;color:var(--muted)}
.progress{height:8px;background:#e7eee9;border-radius:99px;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:var(--accent);width:0}
.badge{display:inline-block;background:var(--soft);color:#174c30;border-radius:30px;padding:4px 9px;font-size:12px;font-weight:700}
.hidden{display:none}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
@media(max-width:760px){.layout{grid-template-columns:1fr}#nav{grid-template-columns:1fr 1fr;max-height:310px}.card{padding:14px}main{padding:12px 10px 35px}}
</style>

<script>
const P = [
{title:"Бактерии — древнейшие организмы на Земле",note:"Бактерии — преимущественно одноклеточные организмы. Их клетки не имеют оформленного ядра, поэтому бактерии относят к прокариотам. Наследственная информация находится в бактериальной хромосоме в цитоплазме. Клетка обычно имеет мембрану и клеточную стенку; у некоторых есть жгутики и слизистая капсула. По форме различают кокки, бациллы и спириллы. По отношению к кислороду выделяют аэробов и анаэробов. Бактерии бывают автотрофами и гетеротрофами; размножаются преимущественно делением клетки надвое.",terms:[["Прокариоты","Организмы, клетки которых не имеют оформленного ядра."],["Бактериальная хромосома","Структура с наследственной информацией бактерии."],["Кокки","Шаровидные бактерии."],["Бациллы","Палочковидные бактерии."],["Спириллы","Спиралевидные бактерии."],["Аэробы","Организмы, которым для жизни нужен кислород."],["Анаэробы","Организмы, способные жить без кислорода."],["Автотрофы","Организмы, самостоятельно образующие органические вещества."],["Гетеротрофы","Организмы, использующие готовые органические вещества."]],quiz:[["Почему бактерии называют прокариотами?",["У них нет оформленного ядра","Они всегда многоклеточные","У них нет цитоплазмы","Они питаются только светом"],0,"Главный признак прокариот — отсутствие оформленного ядра."],["Как размножается большинство бактерий?",["Почкованием","Делением клетки надвое","Спорами как грибы","Семенами"],1,"Обычный способ размножения бактерий — деление клетки надвое."]]},
{title:"Роль бактерий в природе и жизни человека",note:"Бактерии участвуют в круговороте веществ: разлагают остатки организмов и возвращают вещества в окружающую среду. Сапротрофные бактерии питаются мёртвым органическим материалом. Некоторые бактерии связывают атмосферный азот; клубеньковые бактерии живут в клубеньках на корнях бобовых растений. Часть бактерий полезна человеку: используется при производстве кисломолочных продуктов и в других биотехнологических процессах. Другие вызывают порчу продуктов и болезни. Низкая температура замедляет размножение многих бактерий. Пастеризация — нагревание продукта для уничтожения большинства микроорганизмов.",terms:[["Сапротрофы","Организмы, питающиеся мёртвыми органическими остатками."],["Азотфиксация","Связывание атмосферного азота и превращение его в соединения, доступные организмам."],["Клубеньковые бактерии","Бактерии, живущие в клубеньках на корнях бобовых растений."],["Симбиоз","Тесное совместное существование организмов разных видов."],["Пастеризация","Нагревание продукта для уничтожения большинства микроорганизмов."]],quiz:[["Почему клубеньковые бактерии важны для бобовых растений?",["Они обеспечивают растение соединениями азота","Они превращают корни в листья","Они заменяют солнечный свет","Они не дают растению дышать"],0,"Клубеньковые бактерии связывают атмосферный азот."],["Что происходит при пастеризации?",["Продукт замораживают","Продукт нагревают для уничтожения большинства микроорганизмов","В продукт добавляют грибницу","Продукт высушивают на солнце"],1,"Пастеризация основана на нагревании продукта."]]},
{title:"Бактерии — возбудители болезней",note:"Болезнетворные бактерии способны вызывать заболевания. Они могут проникать в организм разными путями, размножаться и нарушать работу органов. Некоторые выделяют токсины — вещества, вредные для организма. Профилактика включает личную гигиену, мытьё рук, безопасную воду и пищу, правильное хранение продуктов и соблюдение медицинских рекомендаций. Антибиотики действуют на некоторые бактерии, но не лечат вирусные инфекции; их применяют только по назначению врача.",terms:[["Болезнетворные бактерии","Бактерии, способные вызывать заболевания."],["Инфекция","Проникновение и размножение возбудителя в организме."],["Токсины","Вещества, которые могут повреждать клетки и нарушать работу организма."],["Профилактика","Меры, направленные на предупреждение заболеваний."],["Антибиотики","Лекарства, действующие на бактерии; не действуют на вирусы."]],quiz:[["Почему антибиотики не применяют для лечения вирусных инфекций?",["Они действуют на бактерии, а не на вирусы","Вирусы являются грибами","Антибиотики действуют только на растения","Вирусы всегда крупнее бактерий"],0,"Антибиотики предназначены для борьбы с бактериальными инфекциями."],["Что относится к профилактике бактериальных инфекций?",["Мытьё рук и безопасная пища","Хранение продуктов в тепле","Отказ от чистой воды","Приём антибиотиков без назначения"],0,"Гигиена и безопасность пищи уменьшают риск заражения."]]},
{title:"Цианобактерии",note:"Цианобактерии — бактерии, способные к фотосинтезу. Они содержат пигменты, поглощающие свет, и образуют органические вещества из неорганических. При фотосинтезе выделяется кислород. Цианобактерии встречаются в воде и влажной среде; некоторые способны образовывать колонии и нити. Их деятельность имеет значение для водных экосистем и круговорота веществ.",terms:[["Цианобактерии","Бактерии, способные к кислородному фотосинтезу."],["Фотосинтез","Образование органических веществ из неорганических с использованием энергии света."],["Пигменты","Окрашенные вещества, поглощающие свет."],["Колония","Группа клеток, связанных совместным существованием."]],quiz:[["Как цианобактерии получают органические вещества?",["Путём фотосинтеза","Поглощая готовую пищу клеточным ртом","Только разлагая древесину","Путём поедания бактерий"],0,"Цианобактерии используют энергию света."],["К какой группе организмов относятся цианобактерии?",["К прокариотам","К грибам","К животным","К цветковым растениям"],0,"У них нет оформленного ядра."]]},
{title:"Гетеротрофные протисты. Амёба обыкновенная",note:"Амёба обыкновенная — одноклеточный гетеротрофный протист. Она передвигается с помощью ложноножек — временных выростов цитоплазмы. Ложноножками амёба захватывает пищевые частицы; этот процесс называется фагоцитозом. Внутри клетки образуется пищеварительная вакуоль, где пища переваривается. Сократительная вакуоль удаляет избыток воды. Амёба обычно размножается делением клетки надвое.",terms:[["Протисты","Группа эукариотических организмов, включающая одноклеточные и некоторые многоклеточные формы."],["Ложноножки","Временные выросты цитоплазмы для движения и захвата пищи."],["Фагоцитоз","Захват клеткой твёрдых частиц пищи."],["Пищеварительная вакуоль","Структура, в которой переваривается пища."],["Сократительная вакуоль","Структура, удаляющая избыток воды из клетки."],["Гетеротроф","Организм, питающийся готовыми органическими веществами."]],quiz:[["Амёба окружила пищевую частицу ложноножками. Как называется этот процесс?",["Фотосинтез","Фагоцитоз","Дыхание","Конъюгация"],1,"Вспомни, как клетка захватывает твёрдые частицы."],["Какова функция сократительной вакуоли?",["Переваривание пищи","Удаление избытка воды","Образование света","Хранение наследственной информации"],1,"Эта вакуоль помогает поддерживать водный баланс клетки."]]},
{title:"Инфузория-туфелька",note:"Инфузория-туфелька — одноклеточный протист, передвигающийся с помощью многочисленных ресничек. Пища поступает через клеточный рот и клеточную глотку, затем попадает в пищеварительные вакуоли. Непереваренные остатки удаляются наружу. У инфузории два типа ядер: макронуклеус и микронуклеус. Они выполняют разные функции. Сократительные вакуоли участвуют в удалении избытка воды. Половой процесс конъюгация связан с обменом наследственным материалом между клетками.",terms:[["Реснички","Короткие многочисленные выросты, обеспечивающие движение."],["Клеточный рот","Участок клетки, через который поступает пища."],["Клеточная глотка","Канал, по которому пища проходит внутрь клетки."],["Макронуклеус","Большое ядро инфузории, управляющее повседневной жизнедеятельностью клетки."],["Микронуклеус","Малое ядро, участвующее в передаче наследственной информации."],["Конъюгация","Половой процесс обмена наследственным материалом между клетками."]],quiz:[["Какая структура обеспечивает движение инфузории?",["Ложноножки","Реснички","Один жгутик","Клеточная стенка"],1,"У инфузории много коротких подвижных выростов."],["Что происходит при конъюгации?",["Обмен наследственным материалом","Поглощение солнечного света","Образование грибницы","Деление на множество спор"],0,"Конъюгация связана с наследственным материалом двух клеток."]]},
{title:"Одноклеточные автотрофные и автогетеротрофные протисты",note:"Эвглена зелёная имеет жгутик для движения, хлоропласты для фотосинтеза и светочувствительный глазок — стигму. На свету она образует органические вещества при фотосинтезе, а при отсутствии света может использовать готовые органические вещества. Такой смешанный способ питания называют миксотрофным.",terms:[["Автотроф","Организм, образующий органические вещества из неорганических."],["Миксотроф","Организм, способный сочетать автотрофное и гетеротрофное питание."],["Жгутик","Подвижный вырост клетки, обеспечивающий движение."],["Стигма","Светочувствительный глазок у некоторых протистов."],["Хлоропласт","Органоид, в котором происходит фотосинтез."]],quiz:[["Почему эвглену называют миксотрофом?",["Она сочетает фотосинтез и использование готовых органических веществ","Она питается только бактериями","Она не способна к фотосинтезу","Она питается только минеральными солями"],0,"Сравни питание эвглены на свету и в темноте."],["Какую роль выполняет стигма?",["Помогает воспринимать свет","Переваривает пищу","Удаляет воду","Образует жгутик"],0,"Стигма связана с реакцией на свет."]]},
{title:"Многоклеточные протисты",note:"Многоклеточные протисты, в частности водоросли, имеют тело из множества клеток. Их тело часто не разделено на настоящие органы и ткани, как у высших растений. Такое тело называют слоевищем, или талломом. Клетки могут различаться по строению и выполнять разные функции. Водоросли обитают преимущественно в воде и влажных местах; многие осуществляют фотосинтез.",terms:[["Слоевище (таллом)","Тело водоросли, не разделённое на настоящие корень, стебель и листья."],["Многоклеточность","Строение организма из множества клеток."],["Дифференциация клеток","Различия клеток по строению и выполняемым функциям."]],quiz:[["Что называют слоевищем водоросли?",["Тело, не разделённое на настоящие органы","Только корневую систему","Цветок и плод","Подземный побег"],0,"У водорослей нет настоящих корней, стеблей и листьев."],["Что характерно для многоклеточных водорослей?",["Тело состоит из множества клеток","Все они имеют цветки","У всех есть настоящие корни","Они не способны к фотосинтезу"],0,"Главный признак — множество клеток в теле."]]},
{title:"Приспособление водорослей к среде обитания",note:"Водоросли живут в разных водоёмах и на влажных поверхностях. Их строение и окраска связаны с условиями среды, в том числе с освещённостью и глубиной. Разные пигменты позволяют поглощать свет разных участков спектра. У водорослей нет настоящих корней, стеблей и листьев; вещества могут поступать через поверхность тела. Водоросли являются важными производителями органических веществ в водных экосистемах.",terms:[["Пигменты","Вещества, поглощающие свет определённых участков спектра."],["Среда обитания","Условия, в которых живёт организм."],["Производители","Организмы, образующие органические вещества из неорганических, например при фотосинтезе."]],quiz:[["Почему водоросли могут жить в воде без настоящих корней?",["Вещества могут поступать через поверхность тела","Им всегда нужны корни соседних растений","Они не получают воду","Они питаются только животными"],0,"Подумай, с какой средой соприкасается всё тело водоросли."],["От чего зависит распределение водорослей по глубине?",["В том числе от освещённости и пигментов","Только от наличия почвы","Только от ветра","От наличия цветков"],0,"Свет с глубиной меняется, и пигменты имеют значение."]]},
{title:"Общая характеристика грибов. Шляпочные грибы",note:"Грибы — отдельное царство организмов. Они не имеют хлорофилла и питаются готовыми органическими веществами. Тело многих грибов состоит из тонких нитей — гиф, образующих грибницу (мицелий). У шляпочных грибов грибница находится в субстрате, а плодовое тело образует ножку и шляпку. На нижней стороне шляпки или внутри неё формируются споры. Грибы могут быть сапротрофами, паразитами или вступать в симбиоз с растениями. Микориза — взаимосвязь грибницы с корнями растения.",terms:[["Гифы","Тонкие нити, из которых состоит тело многих грибов."],["Грибница (мицелий)","Совокупность гиф гриба."],["Плодовое тело","Структура гриба, в которой образуются споры."],["Споры","Клетки или образования, служащие для размножения и распространения."],["Микориза","Связь грибницы с корнями растения."],["Паразит","Организм, живущий за счёт другого организма и причиняющий ему вред."]],quiz:[["Из чего образуется грибница?",["Из гиф","Из ресничек","Из корней","Из хлоропластов"],0,"Грибница — переплетение нитевидных структур."],["Почему грибы не относят к растениям?",["Они не имеют хлорофилла и питаются готовыми веществами","Они всегда передвигаются","Они имеют клеточный рот","Они не имеют клеток"],0,"Сравни способы получения органических веществ."]]},
{title:"Плесневые грибы и дрожжи",note:"Плесневые грибы часто развиваются на пищевых продуктах и других органических материалах. Их грибница состоит из гиф; у многих плесеней образуются споры, распространяющиеся в окружающей среде. Дрожжи — преимущественно одноклеточные грибы. Многие дрожжи размножаются почкованием. Некоторые дрожжи вызывают брожение сахаров, что используется при изготовлении хлеба и других продуктов.",terms:[["Плесневые грибы","Грибы, образующие налёт из грибницы на субстратах."],["Дрожжи","Преимущественно одноклеточные грибы."],["Почкование","Способ размножения, при котором на материнской клетке образуется вырост — почка."],["Брожение","Процесс превращения органических веществ, например сахаров, с выделением энергии."],["Спорообразование","Образование спор, участвующих в размножении и распространении."]],quiz:[["Как обычно размножаются многие дрожжи?",["Почкованием","Делением на ложноножки","С помощью ресничек","Семенами"],0,"На клетке появляется небольшой вырост."],["Что образует плесневой гриб на субстрате?",["Грибницу из гиф","Клеточный рот","Корни и листья","Цветки"],0,"Плесневой налёт состоит из разрастающихся нитей гриба."]]},
{title:"Роль грибов в природе и жизни человека",note:"Грибы разлагают органические остатки и участвуют в круговороте веществ. Некоторые грибы образуют микоризу с растениями и помогают им получать воду и минеральные вещества. Другие являются паразитами растений, животных и человека. Человек использует съедобные грибы и дрожжи, а также некоторые плесневые грибы в производстве полезных веществ. Грибы могут портить продукты, материалы и вызывать заболевания. Незнакомые грибы нельзя употреблять в пищу.",terms:[["Микориза","Сожительство грибницы с корнями растения."],["Сапротрофы","Организмы, питающиеся мёртвыми органическими остатками."],["Грибы-паразиты","Грибы, питающиеся за счёт живого организма-хозяина."],["Разложение","Преобразование сложных органических остатков в более простые вещества."]],quiz:[["Какую роль грибы-сапротрофы выполняют в природе?",["Разлагают органические остатки","Образуют солнечный свет","Создают минеральные породы","Поглощают только кислород"],0,"Их питание связано с мёртвым органическим материалом."],["Что такое микориза?",["Связь грибницы с корнями растения","Размножение дрожжей","Плодовое тело гриба","Спора бактерии"],0,"Это взаимодействие гриба и корней растения."]]},
{title:"Лишайники",note:"Лишайники — организмы, тело которых образовано совместно живущими грибом и фотосинтезирующим партнёром — водорослью или цианобактерией. Гриб обеспечивает защиту, удерживает воду и минеральные вещества; фотосинтезирующий партнёр образует органические вещества. Тело лишайника — слоевище. Лишайники могут расти на камнях, почве и коре деревьев. Многие лишайники чувствительны к загрязнению воздуха, поэтому их используют как биоиндикаторы.",terms:[["Лишайник","Сложный организм, состоящий из гриба и фотосинтезирующего партнёра."],["Биоиндикатор","Организм, по состоянию или присутствию которого оценивают условия среды."],["Слоевище","Тело лишайника, не разделённое на настоящие органы."],["Фотосинтезирующий партнёр","Водоросль или цианобактерия, образующая органические вещества при фотосинтезе."]],quiz:[["Из каких организмов состоит лишайник?",["Гриба и водоросли или цианобактерии","Двух видов грибов","Бактерии и животного","Только из водорослей"],0,"Один партнёр образует органические вещества, другой обеспечивает защиту и удерживает воду."],["Почему лишайники используют как биоиндикаторы?",["Многие чувствительны к загрязнению воздуха","Они очищают воздух от всех загрязнителей","Они живут только в воде","Они быстро перемещаются"],0,"Их присутствие и состояние отражают качество воздуха."]]}
];
let current=0,mode="note",results={};
const nav=document.getElementById("nav"),content=document.getElementById("content"),overall=document.getElementById("overall");
function renderNav(){nav.innerHTML="";P.forEach((p,i)=>{let b=document.createElement("button");b.className="navbtn"+(i===current?" active":"");b.textContent=(i+1)+". "+p.title;b.onclick=()=>{current=i;mode="note";render()};nav.appendChild(b)});overall.textContent="Открыто параграфов: "+Object.keys(results).length+" из 13";}
function render(){renderNav();let p=P[current];let tabs=`<div class="tabs"><button class="tab ${mode==="note"?"active":""}" data-mode="note">Конспект</button><button class="tab ${mode==="terms"?"active":""}" data-mode="terms">Термины (${p.terms.length})</button><button class="tab ${mode==="quiz"?"active":""}" data-mode="quiz">Тест (${p.quiz.length})</button></div>`;
content.innerHTML=`<div class="muted">ПАРАГРАФ ${current+1} ИЗ 13</div><h2>${p.title}</h2>${tabs}<div id="body"></div><div class="footer"><button class="action" id="prev" ${current===0?"disabled":""}>← Предыдущий</button><button class="action primary" id="next">${current===12?"К первому параграфу":"Следующий →"}</button></div>`;
content.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});
content.querySelector("#prev").onclick=()=>{if(current>0){current--;mode="note";render()}};
content.querySelector("#next").onclick=()=>{current=(current+1)%13;mode="note";render()};
let body=document.getElementById("body");
if(mode==="note"){body.innerHTML=`<span class="badge">КОНСПЕКТ</span><p>${p.note}</p><div class="card"><b>Что нужно уметь</b><p class="muted">Объяснить основные признаки организмов, функции структур, способы питания и размножения, а также значение организмов в природе и жизни человека.</p></div>`}
if(mode==="terms"){body.innerHTML=`<span class="badge">СЛОВАРЬ ТЕРМИНОВ</span>`+p.terms.map(t=>`<div class="term"><b>${t[0]}</b><span>${t[1]}</span></div>`).join("")}
if(mode==="quiz"){let saved=results[current];body.innerHTML=`<span class="badge">ПРОВЕРКА ЗНАНИЙ</span><p class="muted">Выбери один правильный ответ в каждом вопросе. После ответа появится объяснение.</p>`+p.quiz.map((q,j)=>`<div class="question" data-q="${j}"><b>Вопрос ${j+1}</b><p>${q[0]}</p>${q[1].map((o,k)=>`<button class="option" data-k="${k}" ${saved?"disabled":""}>${"АБВГ"[k]}. ${o}</button>`).join("")}<div class="feedback"></div></div>`).join("")+`<div id="score" class="card ${saved?"":"hidden"}"></div><button class="action primary" id="again">Пройти тест заново</button>`;
p.quiz.forEach((q,j)=>{let box=body.querySelector(`[data-q="${j}"]`);box.querySelectorAll("[data-k]").forEach(btn=>btn.onclick=()=>{if(results[current])return;let k=+btn.dataset.k;box.querySelectorAll("[data-k]").forEach(x=>{x.disabled=true;if(+x.dataset.k===q[2])x.classList.add("correct")});if(k!==q[2])btn.classList.add("wrong");box.querySelector(".feedback").textContent=(k===q[2]?"Верно. ":"Пока неверно. ")+q[3];let r=results[current]||{answers:[],score:0};r.answers[j]=k;if(k===q[2])r.score++;if(r.answers.filter(x=>x!==undefined).length===p.quiz.length){results[current]=r;body.querySelector("#score").classList.remove("hidden");body.querySelector("#score").innerHTML=`<b>Результат: ${r.score} из ${p.quiz.length}</b><p class="muted">${r.score===p.quiz.length?"Отлично!": "Посмотри объяснения и повтори материал."}</p>`;renderNav()}})});
body.querySelector("#again").onclick=()=>{delete results[current];render()};
if(saved){saved.answers.forEach((k,j)=>{let q=p.quiz[j],box=body.querySelector(`[data-q="${j}"]`);box.querySelectorAll("[data-k]").forEach(x=>{if(+x.dataset.k===q[2])x.classList.add("correct");if(+x.dataset.k===k&&k!==q[2])x.classList.add("wrong")});box.querySelector(".feedback").textContent=(k===q[2]?"Верно. ":"Неверно. ")+q[3]});body.querySelector("#score").innerHTML=`<b>Результат: ${saved.score} из ${p.quiz.length}</b>`}
}
}
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
